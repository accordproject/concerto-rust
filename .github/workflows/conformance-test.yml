name: Concerto Conformance Tests

# The suite runs against the semantic validation the runtime now implements.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Target Project
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Checkout Conformance Suite
        uses: actions/checkout@v3
        with:
          repository: accordproject/concerto-conformance
          # Pinned to a fixed suite commit so new scenarios landing upstream
          # cannot turn this job red on their own. P5-122
          # (accordproject/concerto-rust#498) removed the deprecated
          # `ModelManager::add_model` the harness at main 57d3c23 calls, so the
          # pin moved to 3035de1, the top of the conformance stack
          # (#41 on #43 on #42, branch claude/tender-pascal-ocwf9q-local-matt-P5-53),
          # whose harness uses the stable `add_model_ast`. That is a draft
          # branch commit: move the pin to conformance main once the stack
          # merges. main pins 9339642 until it catches up.
          ref: 3035de1e726566c15242972b4d5ca96019c066ba
          path: concerto-conformance
      
      - name: Install Conformance Suite Dependencies
        working-directory: concerto-conformance
        run: npm install

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      # Patch the harness's git dependency to this checkout, so the job tests the
      # commit under test rather than the revision pinned in the suite's Cargo.lock.
      - name: Run Rust-based Conformance Tests
        run: >-
          cargo run
          --config 'patch."https://github.com/accordproject/concerto-rust".accordproject-concerto-core.path="concerto-core"'
          --manifest-path concerto-conformance/semantic/features/support/rust/cucumber_tests/Cargo.toml
