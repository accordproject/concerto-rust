name: Concerto Conformance Tests

# The suite runs against the semantic validation the runtime now implements.
# The Rust harness in the upstream suite still expects an earlier shape of our
# API, so the job does not pass yet and is reported rather than hidden.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Target Project
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Checkout Conformance Suite
        uses: actions/checkout@v3
        with:
          repository: accordproject/concerto-conformance
          # Pinned to a fixed suite commit (conformance main 9339642), so new
          # scenarios landing in the suite cannot turn this job red on their own.
          # The migration integration branch (claude/tender-pascal-ocwf9q) bumps
          # this pin when it is ready for the new suite.
          ref: 93396426fd5854e9c691fdef6bf557a026cbb8c4
          path: concerto-conformance
      
      - name: Install Conformance Suite Dependencies
        working-directory: concerto-conformance
        run: npm install

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Run Rust-based Conformance Tests
        run: cargo run --manifest-path concerto-conformance/semantic/features/support/rust/cucumber_tests/Cargo.toml
