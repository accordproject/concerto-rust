name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Concerto Rust
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup update ${{matrix.toolchain}} && rustup default ${{matrix.toolchain}}
      - name: Format check (concerto-core)
        run: rustup component add rustfmt && cargo fmt -p accordproject-concerto-core -- --check
      - name: Clippy (concerto-core)
        run: rustup component add clippy && cargo clippy -p accordproject-concerto-core --no-deps --all-targets -- -D warnings
      - name: Build
        run: cargo build --verbose --workspace --all-targets
      - name: Test
        run: cargo test --workspace

