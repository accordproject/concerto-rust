name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Concerto Rust
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain
        run: rustup update ${{matrix.toolchain}} && rustup default ${{matrix.toolchain}}
      - name: Format check (concerto-core)
        run: rustup component add rustfmt && cargo fmt -p concerto-core -- --check
      - name: Clippy (concerto-core)
        run: cargo clippy -p concerto-core --no-deps --all-targets -- -D warnings
      - name: Build
        run: cargo build --verbose --workspace --all-targets
      - name: Test
        run: cargo test --workspace

