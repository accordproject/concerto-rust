name: Build and Test

on:
  push:
    branches: [main, claude/tender-pascal-ocwf9q]
  pull_request:
    # The migration integration branch too: otherwise a merge into it can break
    # concerto-wasm unnoticed (a new concerto-core JsValue variant, #204/#210).
    branches: [main, claude/tender-pascal-ocwf9q]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Concerto Rust
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup update ${{matrix.toolchain}} && rustup default ${{matrix.toolchain}}
      # Every workspace member: concerto-core, concerto-core-js,
      # concerto-metamodel, concerto-vocabulary and concerto-macros, so the
      # `[workspace.lints]` every member opts into are enforced on all of
      # them. concerto-wasm, a separate workspace, has its own steps below.
      - name: Format check (workspace)
        run: rustup component add rustfmt && cargo fmt --all -- --check
      - name: Clippy (workspace)
        run: rustup component add clippy && cargo clippy --workspace --all-targets -- -D warnings
      # P5-104 (C-9, accordproject/concerto-rust#458): the library alone, with
      # its default features. The run above builds the tests, whose
      # dev-dependencies turn `js-compat` on, so a seam item the native
      # build no longer uses is reported only here.
      - name: Clippy (concerto-core, default features, lib)
        run: cargo clippy -p accordproject-concerto-core --no-deps --lib -- -D warnings
      - name: Format check (concerto-wasm)
        run: cargo fmt --manifest-path concerto-wasm/Cargo.toml -- --check
      - name: Clippy (concerto-wasm, wasm32)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy --manifest-path concerto-wasm/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      # P5-104 (accordproject/concerto-rust#458): the host-side tests too,
      # which the wasm32 lib-only run above never lints.
      - name: Clippy (concerto-wasm, all targets)
        run: cargo clippy --manifest-path concerto-wasm/Cargo.toml --all-targets -- -D warnings
      # concerto-metamodel's committed src/generated/ must be exactly what
      # codegen/generate.js produces from the pinned concerto-codegen
      # (accordproject/concerto-rust#461); tests/drift.rs checks the
      # fingerprints offline, this regenerates and compares byte for byte.
      - name: Drift check (concerto-metamodel generated sources)
        if: matrix.toolchain == 'stable'
        working-directory: concerto-metamodel/codegen
        run: npm ci && node generate.js --check
      - name: Build
        run: cargo build --verbose --workspace --all-targets
      # This job has no oracle fixture corpus (it lives, generated, in an
      # accordproject/concerto checkout), and the oracle harness fails when it
      # finds none. Opt out explicitly: `replays_the_oracle_corpus` is then
      # reported as ignored, never as a pass (concerto-core/tests/oracle/main.rs).
      - name: Test
        run: cargo test --workspace
        env:
          CONCERTO_ORACLE_SKIP: "1"


  # The source comment policy (no migration task ids, no bare, short
  # cross-repo or concerto-rust issue numbers or URLs in concerto-*/src
  # comments). The check lives in accordproject/concerto's guardrails, so it
  # runs from a checkout of concerto pinned to a commit that has the guard
  # (from concerto's migration integration branch); bump the pin together
  # with the guard. A missing script fails the job. Only this checkout is
  # scanned (`--rust-only`): concerto-core's TS sources are concerto's own
  # guardrails' job.
  comment-policy:
    name: Comment policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: accordproject/concerto
          ref: f369d30ffd492a11becfc5c05401a2f0d16107ba
          path: .concerto
          sparse-checkout: |
            migration/guardrails
      - name: Check source comments
        run: node .concerto/migration/guardrails/comment-policy.mjs --rust-root . --rust-only
