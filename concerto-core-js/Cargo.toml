[package]
name = "concerto-core-js"
description = "The JS object model of concerto-core (the TS Resource objects and the JS values they hold), for the WASM binding. Not published."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "concerto_core_js"

[dependencies]
# `js-compat` (docs/public-api.md section 4.6): the seam this crate is built
# on, which is not in core's default API.
accordproject-concerto-core = { path = "../concerto-core", features = ["js-compat"] }
indexmap = { workspace = true }
# `preserve_order` (the JS objects' key order) comes with
# accordproject-concerto-core, which turns it on for the whole graph.
serde_json = { workspace = true }

[dev-dependencies]
# tests/hashdos.rs (P5-110): checks that its crafted keys collide under
# FxHash, the unseeded hasher `JsObject` must not use.
rustc-hash = { workspace = true }

[lints]
workspace = true
