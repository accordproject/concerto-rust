[workspace]
resolver = "3"
members = ["concerto-metamodel", "concerto-core", "concerto-vocabulary"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Accord Project <accordproject.org>"]
keywords = ["concerto", "accordproject", "semantic-data"]
repository = "https://github.com/accordproject/concerto-rust"
categories = ["cryptography", "data-structures", "template-engine"]
homepage = "https://concerto.accordproject.org"

[workspace.dependencies]
fancy-regex = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = "0.4"
