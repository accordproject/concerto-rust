[workspace]
resolver = "3"
members = [
    "concerto-metamodel",
    "concerto-macros",
    "concerto-core",
    "concerto-core-js",
    "concerto-vocabulary",
]
# benches/ is deliberately NOT a workspace member (and is excluded, not just
# omitted, so Cargo doesn't warn that it "believes it's in a workspace"): it
# has an optional path dependency on the separate concerto-validate-rs repo
# (see benches/Cargo.toml), and Cargo requires every path dependency's
# manifest to exist at resolution time, even an optional, feature-gated one,
# before any feature is applied. As a workspace member, that requirement
# applied to `cargo build --workspace` / `cargo test --workspace` too - i.e.
# every crate here, including this repo's own CI - breaking on any checkout
# that doesn't happen to have concerto-validate-rs cloned at that exact path.
# Excluding it means only someone who explicitly builds/benches benches/
# (via `cargo bench --manifest-path benches/Cargo.toml`, see its README)
# needs that sibling checkout.
exclude = ["benches"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Accord Project <accordproject.org>"]
keywords = ["concerto", "accordproject", "semantic-data"]
repository = "https://github.com/accordproject/concerto-rust"
categories = ["data-structures", "template-engine"]
homepage = "https://concerto.accordproject.org"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip`: every Concerto number is a JS double (PORTING.md 3.1),
# and JS `JSON.parse`/`Number::toString` round-trip exactly; serde_json's
# default fast float parser can land 1 ULP off (989.9951327998887 parsed as
# 989.9951327998888), silently changing Double values that cross the
# Serializer fast path (P4-10, accordproject/concerto-rust#69).
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "1.0"
# P5-24 (accordproject/concerto-rust#328): the strict `DateTime` parser
# (concerto-core `instance::dayjs`) and the metamodel's generated
# `DateTime<Utc>` fields. No default features: nothing here reads the clock
# or a time zone database, so `clock`/`wasmbind` (js-sys, wasm-bindgen) and
# `iana-time-zone` stay out of the build (P5-23 follow-up 7).
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
# PORTING.md OD-8: insertion-ordered maps (3.7): a model file's external
# imports (concerto-core) and the JS objects' own properties
# (concerto-core-js).
indexmap = "2"
# The one fast, non-cryptographic hasher of the internal lookup maps
# (P5-13, accordproject/concerto-rust#297; P5-104, C-14: concerto-core-js
# too, in place of foldhash). None of them is iterated on an observable
# path (PORTING.md 3.7).
rustc-hash = "2"
# The native oracle harness's CTO -> AST cache key (P1-07a), as
# migration/oracle/bin/build-cto-cache.js keys it.
sha2 = "0.10"

# P5-104 (C-14): lints every member opts into with `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
format_push_string = "warn"
redundant_clone = "warn"
