[package]
name = "accordproject-concerto-core"
description = "Core runtime for the Accord Project's Concerto modeling language: in-memory model representation and validation."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
repository.workspace = true
categories.workspace = true
homepage.workspace = true
# P5-104 (C-15): the DCS test fixtures (about 220 KB) stay out of the
# published package; the tests that read them run from a checkout.
exclude = ["src/**/testdata"]

[lib]
name = "concerto_core"

[[example]]
name = "standalone"
# P6-02 (accordproject/concerto-rust#84): without `test = true` here, `cargo
# test --workspace` (what ci.yml runs) compiles this example but never runs
# its #[test], so a CI regression in the walkthrough would go unnoticed. This
# is what makes `cargo test -p accordproject-concerto-core` actually execute
# `native_acceptance_walkthrough_runs`, not just `cargo test --example
# standalone` (a command CI never runs).
test = true

[dependencies]
accordproject-concerto-macros = { path = "../concerto-macros", version = "0.1.0" }
accordproject-concerto-metamodel = { path = "../concerto-metamodel", version = "3.17.0"}
serde = { workspace = true }
# OD-3: keep the given AST in its original key order. DV-001
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
# PORTING.md OD-8: insertion-ordered maps (3.7), for a model file's external
# imports.
indexmap = { workspace = true }
# PORTING.md OD-8: ECMAScript regular expressions (ID_REGEX) and ECMAScript
# Number::toString.
regress = "0.12"
ryu-js = "1.0"
# P5-24 (accordproject/concerto-rust#328): strict ISO 8601 / RFC 3339
# `DateTime` parsing, behind the `strictQualifiedDateTimes` regex.
chrono = { workspace = true }
# P5-25 (accordproject/concerto-rust#329): namespace and import versions
# (`model_util::semver_parse`) are parsed by the `semver` crate: strict
# SemVer 2.0.0 since BC-41 (P5-38, accordproject/concerto-rust#348).
semver = "1"
# P5-13 (accordproject/concerto-rust#297): FxHash, a fast non-cryptographic
# hasher, for the internal lookup maps keyed by identifiers (the user-keyed
# namespace and name tables use the seeded foldhash below). None of them is
# ever iterated on an observable path (PORTING.md 3.7).
rustc-hash = { workspace = true }
# P5-110 (accordproject/concerto-rust#477): foldhash under a per-process
# secret seed (`hash::FastSeededState`) for the manager's namespaces and a
# model file's local types and import short names, which are keyed by user
# model names.
foldhash = { workspace = true }

[features]
# P6-01 (accordproject/concerto-rust#83, docs/public-api.md section 4.6):
# the seam the JS-compatibility layer is built on. The JS object model is the
# concerto-core-js crate, which enables this feature, as the WASM binding
# (concerto-wasm) does: `instance::from_json` (`Serializer.fromJSON` over plain
# JSON, and the `Factory` checks), the `ResourceValidator` port with the `$$`
# tag encoding of JS values, the `DateTime` and relationship URI semantics,
# the TS exception-class mapping (`ErrorKind::ts_class`) and the collaborator
# traits. Off by default, so none of it is in the crate's public API; its
# items carry no stability promise. Most of that code is compiled either way
# (the native API is built on it) and is crate-private without the feature;
# the decorator command sets (`dcs`) exist only with it (P5-103, C-1).
js-compat = []
# P5-88 (accordproject/concerto-rust#434): dev-only access to the instance
# validation plan (`instance::plan::testing`): run a closure with every plan
# built afresh on the current thread (P5-99: there is one, plan-based walk),
# so a test can compare cached and fresh outcomes, and count the plans a
# manager holds. Only this crate's own
# dev-dependency (the oracle harness's plan parity test) and the benches'
# opt-in `plan-stats` feature enable it; no release build does, and it
# carries no stability promise.
validation-plan-testing = ["js-compat"]

[dev-dependencies]
# The tests (the native oracle harness among them) drive the JS layer, as the
# WASM binding does.
accordproject-concerto-core = { path = ".", features = ["js-compat", "validation-plan-testing"] }
# The JS object model (`Serializer`, `Factory`, the `Resource` state), which
# the native oracle harness replays the TS instance ops over (P6-01 step 5
# moved it out of this crate).
concerto-core-js = { path = "../concerto-core-js" }
# The native oracle harness (tests/oracle) keys the P1-07a CTO -> AST cache
# by SHA-256, as migration/oracle/bin/build-cto-cache.js does.
sha2 = { workspace = true }
# `test/decoratormanager.js`'s vocabulary tests parse the extracted
# vocabulary YAML (the `yaml` npm package, YAML 1.2) to check its values;
# src/dcs/tests/decoratormanager.rs does the same.
yaml-rust2 = "0.10"

[lints]
workspace = true
