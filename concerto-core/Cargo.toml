[package]
name = "accordproject-concerto-core"
description = "Core runtime for the Accord Project's Concerto modeling language: in-memory model representation and validation."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
repository.workspace = true
categories.workspace = true
homepage.workspace = true

[lib]
name = "concerto_core"

[[example]]
name = "standalone"
# P6-02 (accordproject/concerto-rust#84): without `test = true` here, `cargo
# test --workspace` (what ci.yml runs) compiles this example but never runs
# its #[test], so a CI regression in the walkthrough would go unnoticed. This
# is what makes `cargo test -p accordproject-concerto-core` actually execute
# `native_acceptance_walkthrough_runs`, not just `cargo test --example
# standalone` (a command CI never runs).
test = true

[dependencies]
accordproject-concerto-macros = { path = "../concerto-macros", version = "0.1.0" }
accordproject-concerto-metamodel = { path = "../concerto-metamodel", version = "3.17.0"}
serde = { workspace = true }
# OD-3: keep the given AST in its original key order. DV-001
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
# PORTING.md OD-8: ECMAScript regular expressions (ID_REGEX, node-semver's FULL
# pattern) and ECMAScript Number::toString.
# PORTING.md OD-8: insertion-ordered maps (3.7), for instance fields.
indexmap = "2"
regress = "0.12"
ryu-js = "1.0"

[features]
# P6-01 (accordproject/concerto-rust#83, docs/public-api.md section 4.6):
# the seam the JS-compatibility layer is built on. The JS object model is the
# concerto-core-js crate, which enables this feature, as the WASM binding
# (concerto-wasm) does: `instance::from_json` (`Serializer.fromJSON` over plain
# JSON, and the `Factory` checks), the `ResourceValidator` port with the `$$`
# tag encoding of JS values, the `DateTime` and relationship URI semantics,
# the TS exception-class mapping (`ErrorKind::ts_class`) and the collaborator
# traits. Off by default, so none of it is in the crate's public API; its
# items carry no stability promise. The code is compiled either way (the
# native API is built on it), and is crate-private without the feature.
js-compat = []

[dev-dependencies]
# The tests (the native oracle harness among them) drive the JS layer, as the
# WASM binding does.
accordproject-concerto-core = { path = ".", features = ["js-compat"] }
# The JS object model (`Serializer`, `Factory`, the `Resource` state), which
# the native oracle harness replays the TS instance ops over (P6-01 step 5
# moved it out of this crate).
concerto-core-js = { path = "../concerto-core-js" }
# The native oracle harness (tests/oracle) keys the P1-07a CTO -> AST cache
# by SHA-256, as migration/oracle/bin/build-cto-cache.js does.
sha2 = "0.10"
# `test/decoratormanager.js`'s vocabulary tests parse the extracted
# vocabulary YAML (the `yaml` npm package, YAML 1.2) to check its values;
# src/dcs/decoratormanager_tests.rs does the same.
yaml-rust2 = "0.10"
