[package]
name = "accordproject-concerto-metamodel"
description = "Concerto Metamodel types generated from the `concerto-metamodel` package for Accord Project's Concerto language."
version = "3.17.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
repository.workspace = true
categories.workspace = true
homepage.workspace = true

[lib]
name = "concerto_metamodel"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
chrono = { workspace = true }
# P5-81 spike: the table decoder buffers an out-of-order tagged node as a
# `Value`.
serde_json = { workspace = true, optional = true }

[features]
# P5-81 spike (accordproject/concerto-rust#425): the table-driven decoder,
# `src/table.rs`. Analysis only; not for merge.
table-decoder = ["dep:serde_json"]
# P5-81 spike, size-only alternative: generated metamodel structs derive
# `#[serde(deny_unknown_fields)]`. Not for merge.
alt-deny-unknown = []

[build-dependencies]
serde_json = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
serde_json = { workspace = true }
