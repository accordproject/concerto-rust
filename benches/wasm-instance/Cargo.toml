# The in-WASM half of workload 3 (task P5-13, accordproject/concerto-rust#297):
# the instance validator compiled to wasm32 and timed in V8 under Node, so its
# cost can be compared with TS's `resource.validate()` without the per-call
# work between TS and the engine. See README.md.
#
# Not a member of the root workspace (the root Cargo.toml excludes benches/)
# and its own workspace here (the empty [workspace] table), like
# concerto-wasm. Bench tooling only: nothing links it.
[package]
name = "concerto-bench-wasm-instance"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# `js-compat`: `instance::validate` is part of the JS-compatibility seam.
accordproject-concerto-core = { path = "../../concerto-core", features = ["js-compat"] }
concerto-core-js = { path = "../../concerto-core-js" }
# Pinned to the wasm-bindgen-cli version, as in concerto-wasm.
wasm-bindgen = "=0.2.128"
serde_json = { version = "1.0", features = ["float_roundtrip"] }

# The same release profile as concerto-wasm, so the code is built as the
# engine builds it.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
